  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">Jev City</div>
        <div class="clock" id="clock">Day 1, 00:00</div>
        <div class="stats" id="stats"></div>
        <label class="field">
          <span class="sr-only">City conditions</span>
          <select id="event-select"></select>
          <svg class="field-chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5 L8 10.5 L12 6.5" /></svg>
        </label>
        <label class="field">
          <span class="sr-only">Disaster frequency</span>
          <select id="chaos-select"></select>
          <svg class="field-chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5 L8 10.5 L12 6.5" /></svg>
        </label>
        <div class="segmented" role="tablist" aria-label="View">
          <span class="segmented-indicator" aria-hidden="true"></span>
          <button type="button" role="tab" data-view="3d" aria-selected="true">3D</button>
          <button type="button" role="tab" data-view="top" aria-selected="false" tabindex="-1">Map</button>
        </div>
        <button type="button" class="btn primary" id="next">Next hour</button>
        <button type="button" class="btn" id="auto" aria-pressed="false">Auto</button>
        <button type="button" class="btn" id="sound" aria-pressed="true">Sound on</button>
      </header>

      <main class="workspace">
        <section class="stage">
          <canvas id="world" tabindex="0" aria-label="Town view. Drag to pan, right-drag or shift-drag to orbit, scroll to zoom, arrow keys to move."></canvas>
          <div class="pad" aria-label="Camera controls">
            <div class="pad-grid">
              <span></span><button type="button" data-pan="0,1" aria-label="Pan forward">▲</button><span></span>
              <button type="button" data-pan="-1,0" aria-label="Pan left">◀</button><button type="button" id="center" aria-label="Center on the town">●</button><button type="button" data-pan="1,0" aria-label="Pan right">▶</button>
              <span></span><button type="button" data-pan="0,-1" aria-label="Pan back">▼</button><span></span>
            </div>
            <div class="pad-row">
              <button type="button" data-rotate="1" aria-label="Rotate left">⟲</button>
              <button type="button" data-rotate="-1" aria-label="Rotate right">⟳</button>
            </div>
            <div class="pad-row">
              <button type="button" data-zoom="1" aria-label="Zoom in">+</button>
              <button type="button" data-zoom="-1" aria-label="Zoom out">−</button>
            </div>
          </div>
          <div class="toasts" id="toasts" aria-live="polite"></div>
          <section class="ending" id="ending" role="dialog" aria-label="The end of Jevton" hidden></section>
          <div class="hint show" id="hint"><span class="hint-key" aria-hidden="true">?</span><span class="hint-text">Drag to pan · Right-drag or shift-drag to orbit · Scroll to zoom · WASD or arrows to move · Click a resident to follow them</span></div>
          <p class="status" id="status" role="status" hidden></p>
        </section>
        <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
      </main>
    </div>
